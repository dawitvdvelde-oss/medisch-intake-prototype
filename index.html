<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Medisch intake recorder</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy: #1a3560;
      --blue: #2563a8;
      --red: #c95447;
      --red-deep: #b44438;
      --bg: #eef3f9;
      --white: #ffffff;
      --glow1: rgba(180,205,235,0.55);
      --glow2: rgba(195,215,240,0.30);
      --glow3: rgba(210,225,245,0.15);
      --wave-idle: rgba(150,185,225,0.45);
      --wave-rec: rgba(201,84,71,0.35);
    }

    html, body {
      height: 100%;
      font-family: 'DM Sans', Arial, sans-serif;
      background: var(--bg);
      color: var(--navy);
      -webkit-font-smoothing: antialiased;
    }

    .screen {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--white);
      max-width: 480px;
      margin: 0 auto;
      position: relative;
      overflow: hidden;
    }

    .topbar {
      display: flex;
      align-items: center;
      padding: 20px 24px 0;
      flex-shrink: 0;
    }

    .back-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 6px;
      margin-right: 12px;
      color: var(--navy);
      display: flex;
      align-items: center;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-nhl {
      font-size: 26px;
      font-weight: 700;
      color: var(--navy);
      letter-spacing: -0.03em;
      line-height: 1;
    }

    .logo-text {
      font-size: 9px;
      font-weight: 600;
      color: var(--navy);
      letter-spacing: 0.08em;
      line-height: 1.3;
      text-transform: uppercase;
      opacity: 0.75;
    }

    .logo-divider {
      width: 1px;
      height: 28px;
      background: rgba(26,53,96,0.2);
      margin: 0 2px;
    }

    .settings-toggle {
      margin-left: auto;
      border: 0;
      background: #eef3f9;
      color: var(--navy);
      border-radius: 999px;
      width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .page-title {
      text-align: center;
      font-size: 26px;
      font-weight: 700;
      color: var(--navy);
      letter-spacing: -0.02em;
      padding: 28px 24px 0;
      flex-shrink: 0;
    }

    .stage {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 0 0 20px;
    }

    .glow {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
    }

    .glow-1 {
      width: 320px;
      height: 320px;
      background: radial-gradient(circle, var(--glow1) 0%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      transition: background 0.4s;
    }

    .glow-2 {
      width: 440px;
      height: 440px;
      background: radial-gradient(circle, var(--glow2) 0%, transparent 65%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      transition: background 0.4s;
    }

    .glow-3 {
      width: 560px;
      height: 560px;
      background: radial-gradient(circle, var(--glow3) 0%, transparent 60%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .screen.recording .glow-1 {
      background: radial-gradient(circle, rgba(201,84,71,0.18) 0%, transparent 70%);
    }

    .screen.recording .glow-2 {
      background: radial-gradient(circle, rgba(201,84,71,0.09) 0%, transparent 65%);
    }

    .waveform-row {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      align-items: center;
      gap: 4px;
      pointer-events: none;
    }

    .waveform-left { right: calc(50% + 108px); }
    .waveform-right { left: calc(50% + 108px); }

    .wbar {
      width: 3px;
      border-radius: 3px;
      background: var(--wave-idle);
      transition: background 0.4s;
    }

    .screen.recording .wbar { background: var(--wave-rec); }

    .wbar.idle-anim { animation: wbaridle 2.4s ease-in-out infinite; }
    .wbar.rec-anim { animation: wbarrec 0.7s ease-in-out infinite; }

    @keyframes wbaridle {
      0%,100% { height: var(--h); opacity: 0.5; }
      50% { height: calc(var(--h) * 0.6); opacity: 0.3; }
    }

    @keyframes wbarrec {
      0%,100% { height: var(--h); }
      50% { height: calc(var(--h) * 0.2 + 2px); }
    }

    .mic-outer {
      position: relative;
      width: 170px;
      height: 170px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .mic-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: var(--white);
      box-shadow: 0 8px 40px rgba(26,53,96,0.12), 0 2px 8px rgba(26,53,96,0.08);
    }

    .mic-btn {
      position: relative;
      width: 130px;
      height: 130px;
      border-radius: 50%;
      background: var(--red);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, transform 0.1s;
      box-shadow: 0 4px 20px rgba(201,84,71,0.4);
      z-index: 1;
    }

    .mic-btn:active { transform: scale(0.95); }
    .mic-btn:hover { background: var(--red-deep); }

    .mic-btn.sending {
      background: #8899aa;
      cursor: not-allowed;
      box-shadow: 0 4px 20px rgba(100,120,140,0.3);
    }

    .mic-btn::after {
      content: '';
      position: absolute;
      inset: -10px;
      border-radius: 50%;
      border: 2.5px solid rgba(201,84,71,0.3);
      opacity: 0;
      transition: opacity 0.3s;
    }

    .screen.recording .mic-btn::after {
      opacity: 1;
      animation: ringpulse 1.5s ease-in-out infinite;
    }

    @keyframes ringpulse {
      0%,100% { transform: scale(1); opacity: 0.4; }
      50% { transform: scale(1.06); opacity: 0.1; }
    }

    .mic-btn svg {
      width: 52px;
      height: 52px;
      fill: var(--white);
      flex-shrink: 0;
    }

    .spinner-ring {
      display: none;
      position: absolute;
      inset: -6px;
      border-radius: 50%;
      border: 3px solid rgba(255,255,255,0.25);
      border-top-color: var(--white);
      animation: spin 0.8s linear infinite;
    }

    .mic-btn.sending .spinner-ring { display: block; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .bottom {
      flex-shrink: 0;
      text-align: center;
      padding: 0 32px 42px;
    }

    .status-title {
      font-size: 22px;
      font-weight: 700;
      color: var(--navy);
      letter-spacing: -0.02em;
      margin-bottom: 6px;
      min-height: 30px;
      transition: opacity 0.2s;
    }

    .status-sub {
      font-size: 15px;
      font-weight: 400;
      color: #6b82a0;
      min-height: 22px;
      transition: opacity 0.2s;
    }

    .timer {
      font-size: 13px;
      font-weight: 500;
      color: #6b82a0;
      margin-top: 4px;
      font-variant-numeric: tabular-nums;
      min-height: 18px;
    }

    .error-toast {
      display: none;
      position: absolute;
      bottom: 126px;
      left: 20px;
      right: 20px;
      background: #fdecea;
      border: 1px solid #f5c0bb;
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 13px;
      color: #8b2e26;
      text-align: center;
      z-index: 10;
      animation: fadeUp 0.25s ease;
    }

    .error-toast.visible { display: block; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .upload-row {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 24px 14px;
    }

    .upload-label {
      font-size: 12px;
      color: #9aaec2;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: color 0.15s;
    }

    .upload-label:hover { color: var(--blue); }
    .upload-label input { display: none; }
    .upload-label svg { width: 15px; height: 15px; }

    .progress-steps {
      display: none;
      font-size: 12px;
      color: #6b82a0;
      margin-top: 8px;
      animation: fadeUp 0.3s ease;
    }

    .progress-steps.visible { display: block; }

    .settings {
      position: absolute;
      left: 16px;
      right: 16px;
      top: 70px;
      padding: 14px;
      border: 1px solid rgba(26,53,96,0.14);
      border-radius: 14px;
      background: rgba(255,255,255,0.96);
      box-shadow: 0 12px 36px rgba(26,53,96,0.12);
      z-index: 20;
      display: none;
    }

    .settings.visible { display: block; }

    .settings label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #6b82a0;
      margin-bottom: 7px;
    }

    .settings input {
      width: 100%;
      border: 1px solid rgba(26,53,96,0.18);
      border-radius: 10px;
      padding: 10px 11px;
      color: var(--navy);
      font: inherit;
      font-size: 13px;
      outline: none;
    }

    .settings small {
      display: block;
      margin-top: 8px;
      color: #8ba0b6;
      font-size: 12px;
      line-height: 1.35;
    }
  </style>
</head>
<body>
  <div class="screen" id="screen">
    <div class="topbar">
      <button class="back-btn" type="button" aria-label="Terug" onclick="history.back()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
      </button>
      <div class="logo">
        <span class="logo-nhl">NHL</span>
        <div class="logo-divider"></div>
        <div class="logo-text">Ziekenhuis<br>Intakeprototype</div>
      </div>
      <button class="settings-toggle" type="button" aria-label="Instellingen" onclick="toggleSettings()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06A1.65 1.65 0 0 0 15 19.4a1.65 1.65 0 0 0-1 .6 1.65 1.65 0 0 0-.4 1.1V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 8.6 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-.6-1 1.65 1.65 0 0 0-1.1-.4H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 8.6a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-.6 1.65 1.65 0 0 0 .4-1.1V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9c.14.36.35.69.6 1 .31.27.7.42 1.1.4H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>
    </div>

    <div class="settings" id="settingsPanel">
      <label for="webAppUrl">Google Apps Script webapp-URL</label>
      <input id="webAppUrl" placeholder="https://script.google.com/macros/s/.../exec">
      <small>Deze URL wordt lokaal in deze browser bewaard.</small>
    </div>

    <div class="page-title">Opname</div>

    <div class="stage" id="stage">
      <div class="glow glow-3"></div>
      <div class="glow glow-2"></div>
      <div class="glow glow-1"></div>
      <div class="waveform-row waveform-left" id="waveLeft"></div>
      <div class="mic-outer">
        <div class="mic-ring"></div>
        <button class="mic-btn" id="micBtn" type="button" onclick="toggleRecording()" aria-label="Opname starten">
          <div class="spinner-ring"></div>
          <svg id="micIcon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 1a4 4 0 0 0-4 4v7a4 4 0 0 0 8 0V5a4 4 0 0 0-4-4z"/>
            <path d="M19 10a1 1 0 0 0-2 0 5 5 0 0 1-10 0 1 1 0 0 0-2 0 7 7 0 0 0 6 6.93V19H9a1 1 0 0 0 0 2h6a1 1 0 0 0 0-2h-2v-2.07A7 7 0 0 0 19 10z"/>
          </svg>
        </button>
      </div>
      <div class="waveform-row waveform-right" id="waveRight"></div>
    </div>

    <div class="bottom">
      <div class="status-title" id="statusTitle">Tik om op te nemen</div>
      <div class="status-sub" id="statusSub">Opname starten</div>
      <div class="timer" id="timerEl"></div>
      <div class="progress-steps" id="progressSteps">Audio versturen naar controlepagina...</div>
    </div>

    <div class="error-toast" id="errorToast"></div>

    <div class="upload-row">
      <label class="upload-label">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="17 8 12 3 7 8"/>
          <line x1="12" y1="3" x2="12" y2="15"/>
        </svg>
        Bestand uploaden
        <input type="file" id="fileInput" accept=".mp3,.mp4,.mpeg,.mpga,.m4a,.wav,.webm,audio/mpeg,audio/mp4,audio/wav,audio/webm" onchange="handleFileUpload(this)">
      </label>
    </div>

    <form id="postForm" method="post">
      <input type="hidden" name="mode" value="review">
      <input type="hidden" id="audioDataUrl" name="audioDataUrl">
      <input type="hidden" id="audioFileName" name="audioFileName">
    </form>
  </div>

  <script>
    (function buildWaves() {
      const heightsL = [14,22,32,18,38,26,44,16,36,28,20,40,24,34,12,30,46,18,28,36,22];
      const heightsR = [36,20,42,16,30,44,22,38,14,26,40,18,34,28,12,46,20,32,24,38,16];

      function makeBar(h, i) {
        const d = document.createElement('div');
        d.className = 'wbar idle-anim';
        d.style.setProperty('--h', h + 'px');
        d.style.height = h + 'px';
        d.style.animationDelay = (i * 0.11) + 's';
        d.style.animationDuration = (1.8 + (i % 5) * 0.3) + 's';
        return d;
      }

      heightsL.forEach((h, i) => document.getElementById('waveLeft').appendChild(makeBar(h, i)));
      heightsR.forEach((h, i) => document.getElementById('waveRight').appendChild(makeBar(h, i)));
    })();

    let mediaRecorder = null;
    let audioChunks = [];
    let timerInterval = null;
    let secondsElapsed = 0;
    let isBusy = false;

    const screen = document.getElementById('screen');
    const micBtn = document.getElementById('micBtn');
    const micIcon = document.getElementById('micIcon');
    const statusTitle = document.getElementById('statusTitle');
    const statusSub = document.getElementById('statusSub');
    const timerEl = document.getElementById('timerEl');
    const progressSteps = document.getElementById('progressSteps');
    const errorToast = document.getElementById('errorToast');
    const webAppUrlInput = document.getElementById('webAppUrl');
    const settingsPanel = document.getElementById('settingsPanel');
    const postForm = document.getElementById('postForm');
    const audioDataUrlInput = document.getElementById('audioDataUrl');
    const audioFileNameInput = document.getElementById('audioFileName');

    webAppUrlInput.value = localStorage.getItem('medicalIntakeWebAppUrl') || '';
    webAppUrlInput.addEventListener('input', () => {
      localStorage.setItem('medicalIntakeWebAppUrl', webAppUrlInput.value.trim());
    });

    function toggleSettings() {
      settingsPanel.classList.toggle('visible');
    }

    function fmt(s) {
      return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
    }

    function showError(msg) {
      errorToast.textContent = msg;
      errorToast.classList.add('visible');
      setTimeout(() => errorToast.classList.remove('visible'), 5000);
    }

    function animateBars(recording) {
      document.querySelectorAll('.wbar').forEach((b, i) => {
        b.classList.remove('idle-anim', 'rec-anim');
        if (recording) {
          b.style.animationDuration = (0.5 + Math.random() * 0.6) + 's';
          b.style.animationDelay = (Math.random() * 0.3) + 's';
          b.classList.add('rec-anim');
        } else {
          b.style.animationDuration = (1.8 + (i % 5) * 0.3) + 's';
          b.style.animationDelay = (i * 0.11) + 's';
          b.classList.add('idle-anim');
        }
      });
    }

    function setIdle() {
      isBusy = false;
      screen.classList.remove('recording');
      micBtn.classList.remove('sending');
      micBtn.disabled = false;
      micIcon.innerHTML = '<path d="M12 1a4 4 0 0 0-4 4v7a4 4 0 0 0 8 0V5a4 4 0 0 0-4-4z"/><path d="M19 10a1 1 0 0 0-2 0 5 5 0 0 1-10 0 1 1 0 0 0-2 0 7 7 0 0 0 6 6.93V19H9a1 1 0 0 0 0 2h6a1 1 0 0 0 0-2h-2v-2.07A7 7 0 0 0 19 10z"/>';
      statusTitle.textContent = 'Tik om op te nemen';
      statusSub.textContent = 'Opname starten';
      timerEl.textContent = '';
      progressSteps.classList.remove('visible');
      animateBars(false);
    }

    function setRecording() {
      screen.classList.add('recording');
      micIcon.innerHTML = '<rect x="6" y="6" width="12" height="12" rx="2"/>';
      statusTitle.textContent = 'Opname actief';
      statusSub.textContent = 'Tik om te stoppen';
      animateBars(true);
    }

    function setSending() {
      isBusy = true;
      screen.classList.remove('recording');
      micBtn.classList.add('sending');
      micBtn.disabled = true;
      statusTitle.textContent = 'Verwerken...';
      statusSub.textContent = 'Controlepagina openen';
      progressSteps.classList.add('visible');
      animateBars(false);
    }

    async function toggleRecording() {
      if (isBusy) return;

      if (mediaRecorder && mediaRecorder.state === 'recording') {
        stopRec();
        return;
      }

      const webAppUrl = getWebAppUrl();
      if (!webAppUrl) return;

      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
        audioChunks = [];
        secondsElapsed = 0;
        timerEl.textContent = '00:00';

        const mimeType = pickMimeType();
        mediaRecorder = mimeType ? new MediaRecorder(stream, { mimeType }) : new MediaRecorder(stream);

        mediaRecorder.addEventListener('dataavailable', e => {
          if (e.data && e.data.size > 0) audioChunks.push(e.data);
        });
        mediaRecorder.addEventListener('stop', onStop);
        mediaRecorder.start();

        setRecording();
        timerInterval = setInterval(() => {
          secondsElapsed++;
          timerEl.textContent = fmt(secondsElapsed);
        }, 1000);
      } catch (err) {
        showError('Microfoon niet beschikbaar: ' + err.message);
      }
    }

    function stopRec() {
      clearInterval(timerInterval);
      timerInterval = null;
      mediaRecorder.stop();
      mediaRecorder.stream.getTracks().forEach(t => t.stop());
      setSending();
    }

    function onStop() {
      const mime = (mediaRecorder && mediaRecorder.mimeType) || pickMimeType() || 'audio/webm';
      const blob = new Blob(audioChunks, { type: mime });
      readAndSend(blob, 'intake-opname' + extensionForMimeType(mime));
    }

    function handleFileUpload(input) {
      const file = input.files && input.files[0];
      if (!file || isBusy) return;
      if (!getWebAppUrl()) return;
      setSending();
      statusSub.textContent = file.name;
      const reader = new FileReader();
      reader.onloadend = () => sendDataUrl(reader.result, file.name);
      reader.onerror = () => { setIdle(); showError('Bestand kon niet worden gelezen.'); };
      reader.readAsDataURL(file);
    }

    function readAndSend(blob, name) {
      const reader = new FileReader();
      reader.onloadend = () => sendDataUrl(reader.result, name);
      reader.onerror = () => { setIdle(); showError('Audio kon niet worden gelezen.'); };
      reader.readAsDataURL(blob);
    }

    function sendDataUrl(dataUrl, fileName) {
      audioDataUrlInput.value = dataUrl;
      audioFileNameInput.value = fileName;
      postForm.action = getWebAppUrl();
      postForm.submit();
    }

    function getWebAppUrl() {
      const value = webAppUrlInput.value.trim();
      if (!value) {
        settingsPanel.classList.add('visible');
        showError('Plak eerst de Google Apps Script webapp-URL.');
        return '';
      }
      localStorage.setItem('medicalIntakeWebAppUrl', value);
      return value;
    }

    function pickMimeType() {
      const candidates = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/mpeg'];
      for (const type of candidates) {
        if (MediaRecorder.isTypeSupported(type)) return type;
      }
      return '';
    }

    function extensionForMimeType(mimeType) {
      if (mimeType.includes('mp4')) return '.m4a';
      if (mimeType.includes('mpeg')) return '.mp3';
      return '.webm';
    }
  </script>
</body>
</html>
